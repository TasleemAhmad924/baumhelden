<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#16a34a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="leaves" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="3" fill="#22c55e" opacity="0.3"/>
      <circle cx="80" cy="30" r="2" fill="#16a34a" opacity="0.4"/>
      <circle cx="50" cy="70" r="4" fill="#15803d" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#leaves)"/>
  
  <!-- Chainsaw silhouette -->
  <g transform="translate(200, 300)" opacity="0.1">
    <rect x="0" y="20" width="400" height="60" rx="30" fill="#374151"/>
    <rect x="50" y="0" width="300" height="100" rx="50" fill="#6b7280"/>
    <circle cx="100" cy="50" r="15" fill="#9ca3af"/>
    <circle cx="300" cy="50" r="15" fill="#9ca3af"/>
    <rect x="350" y="30" width="80" height="40" rx="20" fill="#374151"/>
  </g>
</svg>
